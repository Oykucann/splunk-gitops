# Defaults. Server-specific values go into local/gitops.conf.
[gitops]
# This server's name in the inventory and its role (cm | ds | deployer | sh)
host_id =
role =

# GitLab
gitlab_url =
# project path (group/subgroup/repo) or numeric project ID
project =
branch = main
# Inventory file in the repo. If several environments share one repo: envs/<env>/org_splunk_inventory.yaml
inventory_file = org_splunk_inventory.yaml
# Company internal CA (empty: system CAs)
ca_bundle =
http_timeout = 60
max_archive_mb = 500
# Used if GitLab does not return the expiry date (YYYY-MM-DD)
token_expires =
token_warn_days = 30

# This server's Splunk management URI
splunk_mgmt_uri = https://127.0.0.1:8089
splunk_verify_tls = false

# when run as a scripted input: plan | stage | apply
mode = plan

# Backups: keep the last N versions per dest
backup_dir = /home/splunk/org_gitops_app_backup
backup_keep = 2
min_free_mb = 1024

# CM (active-passive comes from cm_ha_availability in the inventory)
allow_rolling_restart = false
require_rf_sf_met = true

# Deployer: SHC member used as the push target
shc_target_uri =

# Additional apps that are never touched (comma-separated)
protected_apps =
